<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeQuest Login</title>
  <style>
    /* Reset and basic styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1a1a2e;
      overflow: hidden;
      position: relative;
    }

    /* Particle canvas */
    #particleCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Login card */
    .login-card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.05);
      padding: 2rem;
      border-radius: 12px;
      width: 320px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .login-card h1 {
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
      color: #f0f0f0;
    }

    .login-card input {
      width: 100%;
      padding: 0.8rem;
      margin: 0.5rem 0;
      border: none;
      border-radius: 6px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 1rem;
    }

    .login-card input::placeholder {
      color: rgba(255,255,255,0.6);
    }

    .login-card button {
      width: 100%;
      padding: 0.8rem;
      margin: 0.5rem 0;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }

    #loginBtn {
      background: #ff7e5f;
      color: #fff;
    }

    #loginBtn:hover {
      background: #eb6750;
    }

    #registerBtn {
      background: transparent;
      border: 1px solid #ff7e5f;
      color: #ff7e5f;
    }

    #registerBtn:hover {
      background: #ff7e5f;
      color: #fff;
    }

    .login-card small {
      display: block;
      margin-top: 1rem;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
    }

    @media(max-width: 400px) {
      .login-card {
        width: 90%;
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="particleCanvas"></canvas>     
  
<!--user login -->
  <div class="login-card">
    <h1>CodeQuest</h1>
    <input id="username" type="text" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <button id="registerBtn">Register</button>
    <small>Enter your credentials to start your adventure.</small>
  </div>

  <script type="module">
    import GameState from './src/GameState.js';

    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const registerBtn = document.getElementById('registerBtn');

    loginBtn.addEventListener('click', async () => {
      const username = usernameInput.value;
      const player_password = passwordInput.value;

      if (!username || !player_password) return alert("Fill both fields");

      try {
        const res = await fetch('http://localhost:3000/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, player_password })
        });

        const data = await res.json();

        if (data.success) {
          GameState.player = data.player;
          window.location.href = 'game.html';
        } else {
          alert(data.error || "Login failed");
        }

      } catch (err) {
        console.error(err);
        alert("Server error");
      }
    });

    registerBtn.addEventListener('click', async () => {
      const username = usernameInput.value;
      const player_password = passwordInput.value;
      const email = prompt("Enter your email:");

      if (!username || !player_password || !email) return alert("Fill all fields");

      try {
        const res = await fetch('http://localhost:3000/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, player_password, email })
        });

        const data = await res.json();
        if (data.success) alert("Registration successful! You may now login.");
        else alert(data.error || "Registration failed");
      } catch (err) {
        console.error(err);
        alert("Server error");
      }
    });

    // Particle background effect
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.size = Math.random() * 2 + 1;
        this.alpha = Math.random() * 0.5 + 0.2;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) this.reset();
      }
      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    const particles = [];
    for (let i = 0; i < 120; i++) particles.push(new Particle());

    const animate = () => {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
