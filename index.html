<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeQuest Login</title>
</head>
<body>
  <h1>CodeQuest Login</h1>

  <input id="username" type="text" placeholder="Username">
  <input id="password" type="password" placeholder="Password">
  <button id="loginBtn">Login</button>
  <button id="registerBtn">Register</button>

  <script type="module">
  import GameState from './src/GameState.js';

  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const loginBtn = document.getElementById('loginBtn');
  const registerBtn = document.getElementById('registerBtn');

  loginBtn.addEventListener('click', async () => {
    const username = usernameInput.value;
    const player_password = passwordInput.value; // match server

    if (!username || !player_password) return alert("Fill both fields");

    try {
      const res = await fetch('http://localhost:3000/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, player_password }) // use player_password
      });

      const data = await res.json();

      if (data.success) {
        GameState.player = data.player; // save player globally
        window.location.href = 'game.html'; // redirect to game
      } else {
        alert(data.error || "Login failed");
      }

    } catch (err) {
      console.error(err);
      alert("Server error");
    }
  });

  registerBtn.addEventListener('click', async () => {
    const username = usernameInput.value;
    const player_password = passwordInput.value; // match server
    const email = prompt("Enter your email:");

    if (!username || !player_password || !email) return alert("Fill all fields");

    try {
      const res = await fetch('http://localhost:3000/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, player_password, email }) // use player_password
      });

      const data = await res.json();
      if (data.success) alert("Registration successful! You may now login.");
      else alert(data.error || "Registration failed");
    } catch (err) {
      console.error(err);
      alert("Server error");
    }
  });

  // Optional: redirect if already logged in
  if (GameState.player) {
    window.location.href = 'game.html';
  }
</script>

</body>
</html>
