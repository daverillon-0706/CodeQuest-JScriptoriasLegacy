<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeQuest Login</title>
  <style>
    /* Reset and basic styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1a1a2e;
      overflow: hidden;
      position: relative;
    }

    /* Particle canvas */
    #particleCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Login card */
    .login-card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.05);
      padding: 2rem;
      border-radius: 12px;
      width: 320px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .login-card h1 {
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
      color: #f0f0f0;
    }

    .login-card input {
      width: 100%;
      padding: 0.8rem;
      margin: 0.5rem 0;
      border: none;
      border-radius: 6px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 1rem;
    }

    .login-card input::placeholder {
      color: rgba(255,255,255,0.6);
    }

    .login-card button {
      width: 100%;
      padding: 0.8rem;
      margin: 0.5rem 0;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }

    #loginBtn {
      background: #ff7e5f;
      color: #fff;
    }

    #loginBtn:hover {
      background: #eb6750;
    }

    #registerBtn {
      background: transparent;
      border: 1px solid #ff7e5f;
      color: #ff7e5f;
    }

    #registerBtn:hover {
      background: #ff7e5f;
      color: #fff;
    }

    .login-card small {
      display: block;
      margin-top: 1rem;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
    }

    @media(max-width: 400px) {
      .login-card {
        width: 90%;
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="particleCanvas"></canvas>     
  
<!--user login -->
  <div class="login-card">
    <h1>CodeQuest</h1>
    <input id="playerName" type="text" placeholder="Enter your name">

    <button id="newGameBtn">New Game</button>

    <input id="saveFileInput" type="file" accept=".json">
    <button id="continueBtn">Continue</button>

    <small>Start a new journey or continue your saved adventure.</small>
  </div>

<script type="module" src="/src/login.js"></script>
  

</body>
</html>
